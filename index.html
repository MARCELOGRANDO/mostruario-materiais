<!DOCTYPE html>
    <html lang="pt-BR" translate="no">
    <head>
        <meta charset="UTF-8">
        <title>Meu Site</title>
    </head>
  <body>
        <style>
            h2.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
            .controls{display:flex;gap:12px;align-items:center;padding:1rem 0 0.75rem;flex-wrap:wrap}
            .controls input{flex:1;min-width:160px}
            .controls select{min-width:130px}
            .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding-bottom:1.5rem}
            .card{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;cursor:pointer;transition:transform .15s}
            .card:hover{transform:scale(1.02)}
            .swatch{height:72px;width:100%}
            .info{padding:8px 10px;background:var(--color-background-primary)}
            .name{font-size:13px;font-weight:500;color:var(--color-text-primary);margin:0 0 2px}
            .id{font-size:11px;color:var(--color-text-secondary);margin:0 0 4px;word-break:break-all}
            .hex{font-size:11px;font-family:var(--font-mono);color:var(--color-text-secondary);margin:0}
            .count{font-size:13px;color:var(--color-text-secondary);padding:0 0 0.5rem}
            .copy-toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--color-text-primary);color:var(--color-background-primary);padding:6px 16px;border-radius:var(--border-radius-md);font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s}
            .controls button{font-size:13px;padding:8px 12px;border-radius:var(--border-radius-md,6px);border:1px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-primary);cursor:pointer;white-space:nowrap}
            .controls button:hover{background:var(--color-background-secondary,rgba(0,0,0,.04))}

            /* ── Modal Ajustado ── */
            #modal-overlay{
              display:none;position:fixed;inset:0;z-index:9999;
              background:rgba(0,0,0,.72);
              align-items:center;justify-content:center;
            }
            #modal-overlay.open{display:flex;}
            #modal-box{
              position:relative;
              width:min(900px,94vw);
              background:#fff;border-radius:12px;overflow:hidden;
              box-shadow:0 24px 80px rgba(0,0,0,.6);
              display:flex;flex-direction:row;
              color:#333;
            }
            @media(max-width: 768px) {
              #modal-box{flex-direction:column; max-height: 90vh; overflow-y: auto;}
            }
            #modal-swatch{
              width: 450px; height: 450px;
              position:relative;overflow:hidden; flex-shrink:0;
              background:#eee;
            }
            @media(max-width: 768px) {
              #modal-swatch{width: 100%; height: 300px;}
            }
            /* A imagem fica por cima da cor de fundo sólida */
            #modal-swatch-img{
              position:absolute;inset:0;
              width:100%;height:100%;object-fit:cover;display:block;
              z-index: 2;
            }
            #modal-swatch-color{
              position:absolute;inset:0;
              z-index: 1;
            }
            #modal-content-right{
              flex:1; padding: 35px 40px; display:flex; flex-direction:column; justify-content:center;
            }
            #modal-info .category-tag{font-size:11px;font-weight:600;color:#b27d54;text-transform:uppercase;margin:0 0 6px;letter-spacing:0.5px;}
            #modal-info .mn{font-size:26px;font-weight:600;margin:0 0 12px;color:#222;}
            #modal-info .description{font-size:13px;line-height:1.6;color:#666;margin-bottom:20px;border-bottom:1px solid #eee;padding-bottom:15px;}
            #modal-specs-title{font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;}
            #modal-specs-grid{display:grid;grid-template-columns: 110px 1fr;row-gap:8px;font-size:13px;}

            #modal-close{
              position:absolute;top:14px;right:16px;z-index:10;
              background:rgba(0,0,0,0.06);border:none;color:#555;
              width:32px;height:32px;border-radius:50%;font-size:16px;
              cursor:pointer;display:flex;align-items:center;justify-content:center;
              transition:background .15s;
            }
            #modal-close:hover{background:rgba(0,0,0,0.12);}
            </style>

<h2 class="sr-only">Paleta de materiais pintados — lista de IDs com suas cores base RGB</h2>

  <select id="biblioteca" onchange="onBibliotecaChange()">

</div>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>

          <span class="spec-label">Biblioteca</span>
          <span class="spec-val" id="spec-biblioteca">-</span>
        </div>
      </div>
    </div>
  </div>
</div>

materials.push(...materialsSimonetto);
materials.push(...materialsStimmo);

const ESPESSURAS_SULFER=["3mm","4mm","5mm","6mm","8mm","18mm","22mm"];
materials.forEach(m=>{
  if(!m.biblioteca) m.biblioteca='Sulfer';
  if(!m.subFamilia) m.subFamilia=['Perfil','Vidro'];
  if(!m.tipos) m.tipos=[];
  if(!m.espessuras) m.espessuras=[...ESPESSURAS_SULFER];
});

function toHex(r,g,b){return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}
function brightness(r,g,b){return 0.299*r+0.587*g+0.114*b}
function hue(r,g,b){const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;if(!d)return 0;let h=max===r?(g-b)/d%6:max===g?(b-r)/d+2:(r-g)/d+4;return h*60}

const PASTA_POR_BIBLIOTECA = {
  'Simonetto': 'TEXTURAS SIMONETTO',
  'Stimmo': 'TEXTURAS STIMMO'
};

function defaultImgSrc(m){
  if(m.img) return m.img;
  const pasta = PASTA_POR_BIBLIOTECA[m.biblioteca];
  return pasta ? pasta + '/' + encodeURIComponent(m.id) + '.jpg' : null;
}

function fillSelect(id,values,placeholder){
  const sel=document.getElementById(id);
  const atual=sel.value;
  sel.innerHTML=`<option value="">${placeholder}</option>`+
    values.map(v=>`<option value="${v}">${v}</option>`).join('');
  sel.value=values.includes(atual)?atual:'';
}

function refreshFilters(){
  const bib=document.getElementById('biblioteca').value;
  const porBib=materials.filter(m=>!bib||m.biblioteca===bib);
  fillSelect('biblioteca',[...new Set(materials.map(m=>m.biblioteca))].sort((a,b)=>a.localeCompare(b)),'Todas as bibliotecas');

  const tipo=document.getElementById('tipo').value;
  fillSelect('tipo',[...new Set(porBib.flatMap(m=>m.tipos))].sort((a,b)=>a.localeCompare(b)),'Todos os tipos');
  const porTipo=porBib.filter(m=>!tipo||m.tipos.includes(tipo));

  const subf=document.getElementById('subfamilia').value;
  fillSelect('subfamilia',[...new Set(porTipo.flatMap(m=>m.subFamilia))].sort((a,b)=>a.localeCompare(b)),'Todas as sub-famílias');
  const porSubf=porTipo.filter(m=>!subf||m.subFamilia.includes(subf));

  fillSelect('espessura',[...new Set(porSubf.flatMap(m=>m.espessuras))].sort((a,b)=>parseInt(a)-parseInt(b)),'Qualquer espessura');
}

function onBibliotecaChange(){
  document.getElementById('tipo').value='';
  document.getElementById('subfamilia').value='';
  document.getElementById('espessura').value='';
  refreshFilters();
  render();
}
function onTipoChange(){
  document.getElementById('subfamilia').value='';
  document.getElementById('espessura').value='';
  refreshFilters();
  render();
}
function onSubfamiliaChange(){
  document.getElementById('espessura').value='';
  refreshFilters();
  render();
}

function render(){
  refreshFilters();
  const q=document.getElementById('search').value.toLowerCase();
  const bib=document.getElementById('biblioteca').value;
  const tipo=document.getElementById('tipo').value;
  const subf=document.getElementById('subfamilia').value;
  const esp=document.getElementById('espessura').value;
  const s=document.getElementById('sort').value;
  let list=materials.filter(m=>
    (m.name.toLowerCase().includes(q)||m.id.toLowerCase().includes(q))
    && (!bib||m.biblioteca===bib)
    && (!tipo||m.tipos.includes(tipo))
    && (!subf||m.subFamilia.includes(subf))
    && (!esp||m.espessuras.includes(esp))
  );
  list=[...list].sort((a,b)=>{
    if(s==='name')return a.name.localeCompare(b.name);
    if(s==='id')return a.id.localeCompare(b.id);
    if(s==='hue')return hue(a.r,a.g,a.b)-hue(b.r,b.g,b.b);
    if(s==='bright')return brightness(b.r,b.g,b.b)-brightness(a.r,a.g,a.b);
    return 0;
  });
  document.getElementById('count').textContent=list.length+' materiais';
  const g=document.getElementById('grid');
  g.innerHTML=list.map(m=>{
    const hex=toHex(m.r,m.g,m.b);
    const encId=encodeURIComponent(m.id);
    const pasta=PASTA_POR_BIBLIOTECA[m.biblioteca];
    const srcInicial=defaultImgSrc(m);
    const temImagem=!!srcInicial;
    const ehCaminhoConhecido=!!m.img;
    const onImgError=temImagem?(ehCaminhoConhecido?`
      this.style.display='none';
    `:`
      if(!this.dataset.fallback1){this.dataset.fallback1='1';this.src='${pasta}/${encId}.png';}
      else if(!this.dataset.fallback2){this.dataset.fallback2='1';this.src='${pasta}/${encId}.jpeg';}
      else{this.style.display='none';}
    `).replace(/\s+/g,' ').trim():'';
    
    const mJson=encodeURIComponent(JSON.stringify({
      id:m.id, name:m.name, hex, img:srcInicial||'', 
      known:ehCaminhoConhecido?1:0, pasta:pasta||'', encId,
      subFamilia: m.subFamilia.join(', '),
      espessuras: m.espessuras.join(' | '),
      biblioteca: m.biblioteca
    }));

    return `<div class="card" onclick="copy('${hex}','${m.id}')">
      <div class="swatch" style="position:relative;background:${hex};cursor:zoom-in;" onclick="event.stopPropagation();openModal('${mJson}')">
        <img src="${temImagem?srcInicial:''}" alt="${m.name}" data-custom="${ehCaminhoConhecido?'1':''}"
             style="width:100%;height:100%;object-fit:cover;display:${temImagem?'block':'none'};"
             onerror="${onImgError}">
      </div>
      <div class="info">
        <p class="name">${m.name}</p>
        <p class="hex">Sub-Família: ${m.subFamilia.join(', ')}</p>
        <p class="hex">Espessuras: ${m.espessuras.join(', ')}</p>
      </div>
    </div>`;
  }).join('');
}

let toastTimer;
function copy(hex,id){
  const text=`${id}: ${hex.toUpperCase()}`;
  navigator.clipboard.writeText(text).catch(()=>{});
  const t=document.getElementById('toast');
  t.textContent='Copiado: '+hex.toUpperCase();
  t.style.opacity='1';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.style.opacity='0',1800);
}

refreshFilters();
render();

// ── Modal ──
function openModal(encoded){
  const m=JSON.parse(decodeURIComponent(encoded));
  const overlay=document.getElementById('modal-overlay');
  const colorDiv=document.getElementById('modal-swatch-color');
  const img=document.getElementById('modal-swatch-img');

  colorDiv.style.background=m.hex;

  img.style.display='block';
  img.removeAttribute('data-fallback1');
  img.removeAttribute('data-fallback2');
  if(m.img){
    img.src=m.img;
    img.alt=m.name;
    img.onerror=function(){
      if(m.known){
        img.style.display='none';
      } else {
        if(!img.dataset.fallback1){img.dataset.fallback1='1';img.src=m.pasta+'/'+m.encId+'.png';}
        else if(!img.dataset.fallback2){img.dataset.fallback2='1';img.src=m.pasta+'/'+m.encId+'.jpeg';}
        else{img.style.display='none';}
      }
    };
  } else {
    img.style.display='none';
  }

  document.getElementById('modal-name').textContent=m.name;
  document.getElementById('spec-espessuras').textContent=m.espessuras || '-';
  document.getElementById('spec-subfamilia').textContent=m.subFamilia || '-';
  document.getElementById('spec-biblioteca').textContent=m.biblioteca || '-';

  overlay.classList.add('open');
  document.addEventListener('keydown',_escClose);
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  document.removeEventListener('keydown',_escClose);
}

function _escClose(e){if(e.key==='Escape')closeModal();}

document.getElementById('modal-overlay').addEventListener('click',function(e){
  if(e.target===this)closeModal();
});
</script>
